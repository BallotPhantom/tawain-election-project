<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 即時開票 · V2</title>
<link rel="stylesheet" href="v2-shell.css?v=20261022b">
</head>
<body>
<div id="v2-bar">
  <a class="v2-home" href="index.html" data-zh="← 首頁" data-en="← Home">← 首頁</a>
  <span class="v2-title"><span data-zh="2026 即時開票" data-en="2026 Election Night">2026 即時開票</span><span class="v2-badge">V2</span></span>
  <div class="v2-controls">
    <div class="v2-seg" role="group" aria-label="選舉 Race">
      <button type="button" data-sub="mayor" aria-pressed="true" data-zh="縣市長" data-en="Mayors">縣市長</button>
      <button type="button" data-sub="council" aria-pressed="false" data-zh="縣市議員" data-en="Councils">縣市議員</button>
    </div>
  </div>
  <span id="v2-status"></span>
  <span class="v2-spacer"></span>
  <div class="v2-lang" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
</div>
<div id="v2-stage">
  <iframe id="v2-engine" title="2026 即時開票（V1 live2026.html 引擎）"></iframe>
  <div id="v2-veil" data-zh="載入開票頁…" data-en="Loading election night…">載入開票頁…</div>
</div>
<script src="tcborder.js?v=20261101rv1"></script>
<script src="noglow.js?v=20261029f"></script>
<script src="i18n.js?v=20261029c"></script>
<script src="toolbtns.js?v=20261101a"></script>
<script src="navbar.js?v=20261101b"></script>
<script src="disclaimer.js?v=20261031d"></script>
<script src="data_council_seats_2026.js?v=20261107a"></script>
<script src="live-seats2026.js?v=20261107b"></script>
<script src="live-councilhemi.js?v=20261107c"></script>
<script src="live-councilind.js?v=20261107b"></script>
<script src="live-panel.js?v=20261107e"></script>
<script src="v2-shell.js?v=20261101tk"></script>
<script>
  // Election night only: V1's setLiveTrack2026Mode('mayor' | 'council').
  var subButtons = document.querySelectorAll('[data-sub]');
  function setSub(win, sub) {
    win.setLiveTrack2026Mode(sub);
    subButtons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.sub === sub)); });
  }
  V2Shell.boot({
    // ?demo=1 → 引擎改讀2022彩排資料，開票前預覽「開票中」版面（見live2026.html的_LIVE26_DEMO）
    engine: '../live2026.html' + (/[?&]demo=1(&|$)/.test(location.search) ? '?demo=1' : ''),
    needs: ['setLiveTrack2026Mode'],
    title: { zh: '2026 即時開票', en: '2026 Election Night' },
    onReady: function (win) {
      // the real night: the engine's council districts / seats switched to 2026 (CEC 115/8/20 announcement) before the
      // first draw; ?demo=1 keeps the 2022 districts of its rehearsal data (live-seats2026.js)
      if (window.V2LiveSeats2026) window.V2LiveSeats2026.attach(win);
      // county panel: the margin line → cumulative vote bars; no 政黨基本盤天花板 line (live-panel.js) — before setSub,
      // whose setLiveTrack2026Mode starts the 30 s poll timer with whatever _liveTrack26Poll is then
      if (window.V2LivePanel) window.V2LivePanel.attach(win);
      setSub(win, 'mayor');
      // population glow hidden, colour on the blocks — as History and the 2026 forecast (noglow.js; user 2026-10-29:
      // 「把開票的系統把人口光暈隱藏」)
      if (window.V2NoGlow) window.V2NoGlow.attach(win);
      // the 總統／行政院支持率 strip and its fold-out (the engine's predict-mode #seat-summary-float) hidden on election night
      // (user 2026-11-07: 「要把總統行政院支持率的折疊隱藏」); V1 untouched — a style tag in this iframe only
      var st = win.document.createElement('style');
      // + the 圓餅／激戰區域 toggles of the township level (#pie-swing-row; user 2026-11-07: 「舊版的鄉鎮市區層要把圓餅圖激戰區域
      // 關掉」) — off by default, now not offered at all
      st.textContent = '#seat-summary-float,#pie-swing-row{display:none!important}';
      win.document.head.appendChild(st);
      // 縣市議員 seat box: the whole county council, the hovered district lit, coloured by the live leaders (live-councilhemi.js)
      if (window.V2LiveCouncilHemi) window.V2LiveCouncilHemi.attach(win);
      // 平地／山地原住民 drawn solid at 全台, as History (live-councilind.js)
      if (window.V2LiveCouncilInd) window.V2LiveCouncilInd.attach(win);
      subButtons.forEach(function (b) { b.addEventListener('click', function () { setSub(win, b.dataset.sub); }); });
    }
  });
</script>
</body>
</html>
