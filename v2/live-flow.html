<link rel="stylesheet" href="v2-shell.css?v=20261022b">
<!--
  開票動畫 (user 2026-11-05): election-night view where counted votes fly from where people live to the seats —
  「我們嘗試把開票地圖改成這種表達方式？」, 「按照data來源做幾個分頁（在同一頁裡）分開出來」, seats 「都放吧」.
  - one tab per data source; numbers are never merged across sources (same rule as live2026.html's per-source cards);
  - inner ring = 22 縣市長, outer ring = 910 縣市議員 (COUNCIL_SEATS + 原住民選區). A seat is hollow while its party
    leads and solid once the source marks it final; seats sort 綠 ← (open, grey) → 藍 as they fill;
  - base map = population lights (v2/popdots_taiwan_a.bin's tiers), lines start at lights inside the township that
    reported the votes; a line's width ∝ √(votes in its batch);
  - modes: 2026 開票 (data_live2026.js, re-read every 60 s) and 2022 排練 (data_liveflow_r2022.js: CEC-final numbers,
    the counting timeline is SIMULATED and labelled so);
  - 2026 縣市議員 have no party data yet (the sources give names + votes only): those seats stay white;
  - Canvas only, no V1 engine. Data: data_liveflow.js (build_v2_liveflow.py).
-->
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #000; color: #e7eaf0; margin: 0; }
  #lf { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; }
  #lf > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lf-tabs { position: absolute; top: 8px; left: 12px; right: 12px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; z-index: 3; }
  /* smaller (user 2026-11-08: 「2026 排練那一行按鈕可以再小一些」): 12 → 11 px, padding 4×10 → 2×8 */
  .lf-tabs button { font: inherit; font-size: 11px; padding: 2px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); color: #cfd4de; cursor: pointer; }
  .lf-tabs button[aria-pressed="true"] { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.4); }
  .lf-tabs button:disabled { opacity: .35; cursor: not-allowed; }
  .lf-tabs .ts { color: #9aa1b2; font-size: 10.5px; margin-left: 4px; }
  .lf-tabs select { font-size: 11px; }
  .lf-tabs .sep { width: 1px; height: 15px; background: rgba(255,255,255,.15); margin: 0 4px; }
  /* a tidier tab row (user 2026-11-09: 「2026 開票那一行按鈕太多太雜」→「可以」): count / rehearsal one two-part switch, the
     sources one menu (「各家比較」 its last item), the view switch with the playback controls on the right */
  .lf-tabs .seg { display: inline-flex; }
  .lf-tabs .seg button { border-radius: 0; }
  .lf-tabs .seg button:first-child { border-radius: 12px 0 0 12px; }
  .lf-tabs .seg button:last-child { border-radius: 0 12px 12px 0; border-left: 0; }
  .lf-tabs .lf-srcsel, .lf-tabs .lf-ctysel { font: inherit; font-size: 11px; padding: 2px 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); color: #cfd4de; cursor: pointer; }
  .lf-tabs .lf-srcsel option, .lf-tabs .lf-ctysel option { background: #11151f; color: #e7eaf0; }
  .lf-ctl { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .lf-ctl button { padding: 2px 8px; }
  .lf-banner { font-size: 11px; color: #f5c518; }
  .lf-hud { position: absolute; left: 12px; right: 12px; bottom: 10px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; z-index: 3; pointer-events: none; font-variant-numeric: tabular-nums; }
  .lf-side { min-width: 0; }
  .lf-side.r { text-align: right; }
  .lf-side .pt { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .lf-side .vn { font-size: clamp(20px, 3.2vw, 34px); font-weight: 800; line-height: 1.05; transition: font-size .6s ease, opacity .6s ease; }
  /* the side ahead by 1% or more: bigger; the side behind: fainter; within 1% both unchanged (user 2026-11-08) */
  .lf-side .vn.lead { font-size: clamp(24px, 3.9vw, 42px); }
  .lf-side .vn.trail { opacity: .5; }
  .lf-side .vl { font-size: 10px; color: #9aa1b2; letter-spacing: .06em; }
  .lf-side .called { font-size: 14px; font-weight: 800; margin-top: 4px; }
  .lf-side .recent { font-size: 10.5px; color: #b8bfcc; min-height: 28px; }
  .lf-mid { text-align: center; font-size: 11px; color: #b8bfcc; min-width: 0; max-width: 46vw; }
  /* compact (user 2026-11-08: 「台灣地圖可以大一點，下面的時間跟各縣市進來的票小一點」→「好」): time + progress on one line,
     the top 5 county gains on one line, the source line smaller; about 50 px tall, so the island gets the room */
  .lf-mid .clk { font-size: 13px; color: #fff; font-weight: 700; margin-bottom: 2px; }
  .lf-hud .lf-mid .clk { font-size: 11px; font-weight: 600; color: #cfd4de; } .lf-hud .lf-mid .clk .pg { font-size: 10px; }   /* the bottom-centre line, small */
  .lf-mid .clk .pg { font-size: 11px; color: #b8bfcc; font-weight: 600; }
  /* 最新動態 — one line, the latest race event (user 2026-11-08: 「台中＋55k 這種似乎沒有存在的必要」→「換成一行最新動態」;
     the county gains it replaces always listed the most populous counties): a county turning Toss-up, a lead change
     after 5% counted, a projected win, a final result */
  .lf-mid .news { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lf-mid .news .t { color: #7d8496; font-weight: 500; margin-right: 6px; }
  .lf-mid .news.none { color: #7d8496; font-weight: 500; }
  /* the referendum (user 2026-11-09: 「而且還有公投案」→ 右上角公投小長條; rehearsal: 2022 修憲複決 18 歲公民權): agree / disagree
     as shares of the whole electorate on one thin bar, the pass line marked (half for a constitutional amendment, a quarter for
     a referendum); one line of numbers under it */
  .lf-mid .rf { margin-top: 5px; font-size: 10.5px; color: #b8bfcc; }
  .lf-mid .rf .rt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lf-mid .rf .rb { position: relative; height: 5px; margin: 3px 0 2px; background: #2e3340; border-radius: 2px; overflow: visible; }
  .lf-mid .rf .rb i { position: absolute; top: 0; bottom: 0; }
  .lf-mid .rf .rb .th { top: -3px; bottom: -3px; width: 1.5px; background: #f5c518; }
  .lf-mid .rf .rn { font-size: 9.5px; color: #7d8496; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lf-mid .rf .ok { color: #f5c518; font-weight: 700; }
  .lf-mid .prog { margin-top: 5px; }
  /* desktop: the box sits at the top right under the controls, so the island can run down to the bottom (user 2026-11-08:
     「地圖可以再大一些」→ chose 中間資訊搬到右上角); the right county column starts below it */
  .lf-mid.tr { position: absolute; right: 14px; text-align: right; z-index: 3; pointer-events: none; font-variant-numeric: tabular-nums; }
  .lf-mid .src { margin-top: 2px; font-size: 9px; color: #7d8496; }
  .lf-legend { position: absolute; top: 40px; right: 14px; font-size: 10.5px; color: #9aa1b2; text-align: right; line-height: 1.6; z-index: 3; pointer-events: none; }
  .lf-cty { position: absolute; top: 108px; left: 14px; width: 230px; font-size: 11.5px; z-index: 3; font-variant-numeric: tabular-nums; }
  .lf-cty select { font: inherit; font-size: 12px; background: #11151f; color: #e7eaf0; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 3px 6px; max-width: 100%; }
  .lf-cty .box { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(10,13,22,.82); border: 1px solid rgba(255,255,255,.1); }
  .lf-cty h3 { font-size: 13px; margin: 0 0 4px; }
  .lf-cty .row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; margin: 2px 0; }
  .lf-cty .k { color: #9aa1b2; font-size: 10.5px; }
  .lf-cty .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .lf-cty .ring { display: inline-block; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid; vertical-align: middle; }
  /* 22 counties as framed boxes in two side columns (user 2026-11-07): left = the ruling DPP leads, right = an opposition party
     or an independent leads; every leading county of a side is listed at once, two boxes a row; invisible until the mouse is
     over the column (「完全看不到」), then all its boxes flash white and settle into their party colours; a box glides to the
     other side when its lead changes. Box: county + 「▸ 選區」, the two leading mayoral candidates with votes and a party-colour
     bar; 「▸ 選區」 opens the council district list (down to the first loser) under the box */
  #cols { position: absolute; inset: 0; pointer-events: none; z-index: 4; }   /* above the bottom totals (z 3): an open district list covers the big numbers (user 2026-11-07) */
  .col { position: absolute; width: 300px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3px 6px; align-content: start; pointer-events: auto; padding: 2px; }
  .col.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px 4px; }   /* too many boxes for two a row above the bottom totals (fitCols) */
  /* smaller boxes (user 2026-11-07: 「詳細開票資料可以再小塊一些，不要跟在野國民民眾黨那些字重疊」): 10.5 → 9.5 px, line 13 → 11 px */
  .cb { position: relative; border: 1px solid transparent; border-radius: 5px; padding: 2px 4px 1px; font-size: 9.5px; line-height: 11px;
        color: transparent; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cb .hd { display: flex; justify-content: space-between; font-weight: 700; }
  /* a long English county name gets an ellipsis instead of crowding the ☆ / ▸ toggle (user 2026-11-08: 英文版縣市小卡跑版);
     the toggle reads 「Dist.」 in English */
  .cb .hd .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cb .hd .tg, .cb .hd .pin { flex: 0 0 auto; }
  /* the model's tag (Toss-up / Lean / Likely / 推估當選; user 2026-11-08) after the county name, revealed with the box */
  .cb .hd .ct { flex: 0 3 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 auto 0 4px; font-size: 8.5px; font-weight: 600; }
  /* narrow boxes (three a row): the county name keeps ~2 characters, the tag gives way first (ellipsis), 「▸ 選區」 shows
     only its arrow (user 2026-11-08: 「右邊如果是縣市卡三行縣市名字會不見」) */
  .cb .hd .nm { flex: 0 1 auto; min-width: 2.2em; }
  .col.c3 .cb .tg { max-width: 1em; overflow: hidden; }
  .col:hover .cb .ct, .cb.pin-on .ct, .cb.toss-on .ct { color: var(--tc); }
  .cb .tg { cursor: pointer; font-weight: 400; }
  .cb { min-width: 0; }
  .cb .cn { display: flex; justify-content: space-between; gap: 4px; overflow: hidden; }
  .cb .cn span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* a long name (Kolas Yotaka) no longer widens its column */
  .cb .bar { height: 2px; border-radius: 1px; margin: 1px 0 2px; width: 0; transition: width .4s ease; }
  /* 過半保證當選 tick (user 2026-11-07: 「新版跟舊版也加入縣市長的當選門檻」): the bar is votes ÷ the county's expected
     total, so half of the track is where the win is certain; seen with the box (column hover), not for a sole candidate */
  .cb .bt { position: relative; }
  .cb .bt::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: 1px; width: 1px; background: rgba(255,255,255,.55); opacity: 0; }
  .col:hover .cb .bt::after { opacity: 1; transition: opacity .9s; }
  .cb.solo .bt::after { display: none; }
  .cb .det { display: none; position: absolute; left: -1px; top: 100%; width: 292px; padding: 4px 6px 6px; border-radius: 0 0 6px 6px;
             background: rgba(0,0,0,.92); border: 1px solid var(--pc); z-index: 5; color: #e7eaf0; white-space: normal; }
  .cb.open .det { display: block; }
  /* the right column's boxes open their district list toward the left (it ran off the screen's right edge) */
  #col-r .cb .det { left: auto; right: -1px; }
  .cb .det select { font: inherit; font-size: 11px; background: #11151f; color: #e7eaf0; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; margin: 2px 0 4px; }
  .cb .det .k { display: grid; grid-template-columns: 16px 1fr 62px; gap: 4px; }
  .cb .det .gap { color: #f5c518; }
  .col:hover .cb:not(.pin-on):not(.toss-on) { animation: cbGlow .9s forwards; }
  .col:hover .cb:not(.pin-on):not(.toss-on) .cn { animation: cnGlow .9s forwards; }
  .col:hover .cb:not(.pin-on):not(.toss-on) .bar { animation: barGlow .9s forwards; }
  /* 關注 (user 2026-11-07: 「加入想關注縣市的…開關的按鈕讓他常駐，不會滑鼠移開直接隱藏」, kept in place): ☆ / ★ in the box's
     header; a followed box stays lit where it is (it still changes side with the lead); remembered (localStorage lf_pins) */
  .cb .pin { cursor: pointer; font-weight: 400; margin-left: auto; margin-right: 6px; }
  .cb.pin-on { color: #e7eaf0; border-color: var(--pc); background: rgba(10,13,22,.88); }
  .cb.pin-on .cn { color: var(--cc); }
  .cb.pin-on .bar { background: var(--cc); opacity: .75; }
  .cb.pin-on .bt::after { opacity: 1; }
  .cb.pin-on .pin { color: #f5c518; }
  /* resting boxes sit under a grey veil — contents faintly readable — so the cards are hinted in the dark; they light up
     as before when the column is hovered or the box is followed (user 2026-11-08: 「預設的縣市長小卡是在黑暗裡有若隱若現的匡」
     →「小卡加一層灰色遮罩」→「只要灰色遮罩、不要淡框」) */
  #col-l:not(:hover) .cb:not(.pin-on):not(.toss-on), #col-r:not(:hover) .cb:not(.pin-on):not(.toss-on) { color: rgba(160,166,180,.22); background: rgba(120,126,140,.10); }
  #col-l:not(:hover) .cb:not(.pin-on):not(.toss-on) .bar, #col-r:not(:hover) .cb:not(.pin-on):not(.toss-on) .bar { background: rgba(160,166,180,.25); }
  /* a Toss-up county's box lights up by itself, with the map's yellow outline (user 2026-11-08: 「toss up 的縣市小卡也跟著地圖
     自動顯示沒有灰色遮罩」); back under the veil once the race is Lean / Likely / Certain */
  .cb.toss-on { color: #e7eaf0; border-color: #f5c518; background: rgba(10,13,22,.88); }
  .cb.toss-on .cn { color: var(--cc); }
  .cb.toss-on .bar { background: var(--cc); opacity: .75; }
  .cb.toss-on .bt::after { opacity: 1; }
  @keyframes cbGlow { 0% { color: #000; } 25% { color: #fff; border-color: rgba(255,255,255,.9); box-shadow: 0 0 8px rgba(255,255,255,.6); } 100% { color: #e7eaf0; border-color: var(--pc); box-shadow: none; } }
  @keyframes cnGlow { 0% { color: #000; } 25% { color: #fff; } 100% { color: var(--cc); } }
  @keyframes barGlow { 0% { background: transparent; } 25% { background: #fff; } 100% { background: var(--cc); opacity: .75; } }
  /* the picked county (menu or a click on its seats; user 2026-11-07: 「半圓形圖跟詳細開票資料聯動，選出某縣市之後他的詳細
     資料就出現在半圓形圖左邊黑暗處，其他縣市一樣保持在黑暗中」, summary box merged in): its box lit at the top of the left
     side, district list open, the summary (threshold, council seats) under it; the other boxes stay dark */
  #col-f { display: block; width: 300px; }
  #col-f .cb { color: #e7eaf0; border-color: var(--pc); background: rgba(10,13,22,.88); font-size: 10.5px; line-height: 13px; }
  #col-f .cb .cn { color: var(--cc); }
  #col-f .cb .bar { background: var(--cc); opacity: .75; }
  #col-f .cb .bt::after { opacity: 1; }
  #col-f .cb .det { display: block; position: static; width: auto; border: 0; padding: 4px 0 2px; background: none; }
  #col-f .cb .tg { display: none; }
  /* the picked county's mayoral lines merged into its card (user 2026-11-08: 「這張卡直接併入台北卡」) */
  .cb .mx { display: none; }
  #col-f .cb .mx, #ph-list .cb.ph-pick .mx { display: block; color: #9aa1b2; font-size: 10px; line-height: 13px; margin: 3px 0 1px; white-space: normal; }
  #col-f .cb .mx .ml, #ph-list .cb.ph-pick .mx .ml { color: #e7eaf0; }
  #col-f .cb .mx .dot, #col-f .cb .mx .ring, #ph-list .cb .mx .dot, #ph-list .cb .mx .ring { display: inline-block; width: 7px; height: 7px; border-radius: 50%; vertical-align: middle; margin-right: 4px; }
  #col-f .cb .mx .ring, #ph-list .cb .mx .ring { width: 5px; height: 5px; border: 1.5px solid; }
  #col-f #cty { position: static; width: auto; margin-top: 4px; }
  #col-f #cty .box { margin-top: 0; }
  @media (max-width: 640px) { #cols { display: none; } }   /* two 300-px columns do not fit a phone: the list below instead */
  /* phones (user 2026-11-08: 平板／手機提案 A →「a 開始」): the stage keeps one screen; under it the page scrolls to every
     county's box — Toss-up first, then counting, then complete (a picked county above them all) — lit, bigger, no veil
     (no hover on a touch screen); 「▾ 各縣市票數」 at the bottom of the stage jumps there, 「▴ 回到地圖」 back */
  #ph-list, .ph-more { display: none; }
  /* tablets — a touch screen with no hover, wider than a phone (user 2026-11-08: 平板提案 B →「b 也可」): the side columns stay
     put away behind a tab at each edge (「各縣市」); a tap opens both, lit, no veil; a tap on the tab or the map puts them
     away. A Toss-up box (and a followed ★ box) still shows while they are away; the picked county's column is untouched */
  .tb-tab { display: none; }
  body.lf-touch .tb-tab { display: block; position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; writing-mode: vertical-rl; padding: 12px 5px;
                          font: inherit; font-size: 12px; letter-spacing: 2px; color: #cfd4de; background: rgba(18,23,34,.88); border: 1px solid rgba(255,255,255,.22); cursor: pointer; }
  body.lf-touch .tb-tab.l { left: 0; border-left: 0; border-radius: 0 8px 8px 0; }
  body.lf-touch .tb-tab.r { right: 0; border-right: 0; border-radius: 8px 0 0 8px; }
  body.lf-touch #cols:not(.tb-open) :is(#col-l, #col-r) .cb:not(.toss-on):not(.pin-on) { visibility: hidden; }
  body.lf-touch #cols.tb-open :is(#col-l, #col-r) .cb:not(.pin-on) { color: #e7eaf0; border-color: var(--pc); background: rgba(10,13,22,.88); animation: none; }
  body.lf-touch #cols.tb-open :is(#col-l, #col-r) .cb .cn { color: var(--cc); animation: none; }
  body.lf-touch #cols.tb-open :is(#col-l, #col-r) .cb .bar { background: var(--cc); opacity: .75; animation: none; }
  body.lf-touch #cols.tb-open :is(#col-l, #col-r) .cb .hd .ct { color: var(--tc); }
  body.lf-touch #cols.tb-open :is(#col-l, #col-r) .cb .bt::after { opacity: 1; }
  body.lf-touch #cols.tb-open :is(#col-l, #col-r) .cb.toss-on { border-color: #f5c518; }
  @media (max-width: 640px) { body.lf-touch .tb-tab { display: none; } }
  @media (max-width: 640px) {
    html, body { height: auto; overflow-x: hidden; overflow-y: auto; }
    #ph-list { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; padding: 12px 12px calc(28px + env(safe-area-inset-bottom, 0px));
               background: #000; border-top: 1px solid rgba(255,255,255,.12); }
    #ph-list .ph-top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: #e7eaf0; }
    #ph-list .ph-top button, .ph-more { font: inherit; font-size: 11.5px; font-weight: 500; padding: 3px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.22);
               background: rgba(255,255,255,.06); color: #cfd4de; cursor: pointer; }
    .ph-more { display: block; grid-column: 1 / 3; justify-self: center; pointer-events: auto; }
    #ph-list .ph-h { grid-column: 1 / -1; font-size: 11px; color: #9aa1b2; margin-top: 6px; }
    #ph-list .ph-h.toss { color: #f5c518; }
    #ph-list .cb { font-size: 12px; line-height: 16px; padding: 5px 7px 4px; color: #e7eaf0; border-color: var(--pc); background: rgba(10,13,22,.88); }
    #ph-list .cb .cn { color: var(--cc); }
    #ph-list .cb .bar { background: var(--cc); opacity: .75; height: 3px; }
    #ph-list .cb .hd .ct { color: var(--tc); font-size: 10.5px; }
    #ph-list .cb .bt::after { opacity: 1; }
    #ph-list .cb .pin { display: none; }
    #ph-list .cb.toss-on { border-color: #f5c518; }
    #ph-list .cb.ph-pick { border-color: #fff; grid-column: 1 / -1; }

    var f = FEEDS[SRC];
    if (f) { if (f.sim) { tick(f, simT, false); } else { PREV = { T: {}, M: {}, C: {} }; tick(f, null, true); } }
    else { ['hud-g', 'hud-m', 'hud-b'].forEach(function (id) { document.getElementById(id).innerHTML = ''; });   // no source: no stale numbers
      PIL_SNAP = null; drawPillars(); }   // …but the island's outline still drawn (lying view) — 2026 before any source reports
    renderTabs();
  }
  function setMode(m) {
    MODE = m;
    useSeats(m === 'r2022' ? '2022' : '2026');
    if (m === 'r2022') { FEEDS = REH; SRC = 'ltn_cec'; restart(); }
    else { FEEDS = LIVE || {}; SRC = null; renderTabs(); loadLive(function () { FEEDS = LIVE; SRC = null; renderTabs(); restart(); nextLive = performance.now() + 60000; }); }
  }

  // ---------- language ----------
  function applyLang() {
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
    [].forEach.call(document.querySelectorAll('[data-zh]'), function (e) { e.textContent = lang === 'en' ? e.dataset.en : e.dataset.zh; });
    [].forEach.call(document.querySelectorAll('.v2-lang button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    renderTabs();
    // the county boxes are built once (crRow): re-label their fixed texts, then redraw the numbers in the new language
    // (user 2026-11-07: 「中英文切換時詳細縣市卡沒有直接換英文」)
    relabelBoxes();
    lastHud = 0;
    var f = FEEDS[SRC]; if (f && PREV) hud(f, PREV);
  }
  function relabelBoxes() {
    Object.keys(CROWS).forEach(function (cc) {
      var el = CROWS[cc]; if (el.__showPin) el.__showPin();
      el.querySelector('.nm').textContent = ccName(cc);
      el.querySelector('.tg').textContent = (el.classList.contains('open') ? '▾ ' : '▸ ') + T('選區', 'Dist.');
      [].forEach.call(el.querySelectorAll('select option'), function (o) {
        var dk = o.value, n = LF_SEATS.council[dk] ? LF_SEATS.council[dk][1] : '';
        o.textContent = T('第' + (+dk.split('_')[1]) + '選區（應選' + n + '席）', 'District ' + (+dk.split('_')[1]) + ' (' + n + ' seats)');
      });
    });
  }
  [].forEach.call(document.querySelectorAll('.v2-lang button'), function (b) {
    b.onclick = function () { lang = b.dataset.lang; try { localStorage.setItem('v2_lang', lang); } catch (e) {} applyLang(); };
  });

  // ---------- start ----------
  var REH = buildRehearsal();
  window.addEventListener('resize', function () { clearTimeout(window.__lfR); window.__lfR = setTimeout(layout, 120); });
  root.style.cursor = LIE ? 'grab' : '';
  layout();
  // opens on 2026 (user 2026-11-07: 「新版應該要改成2026開票夜」, picked 「2026 開票夜＋預設 2026」); before any source has
  // reported it says so, the 2022 rehearsal one tab away (it used to open on the rehearsal until a source reported)
  loadLive(function () {
    MODE = 'live'; FEEDS = LIVE; useSeats('2026'); nextLive = performance.now() + 60000;
    restart(); applyLang(); layout(); restart();
    requestAnimationFrame(frame);
    // the guide opens by itself on a first visit (user 2026-11-09: 「我想要的指引就是 2026 的打開時…然後常駐在 i」); after that only ⓘ
    setTimeout(function () { var seen = '1'; try { seen = localStorage.getItem('lf_tour_seen'); } catch (e) {} if (!seen) tourStart(); }, 900);
  });
})();
</script>
</body>
</html>
