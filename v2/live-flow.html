<!--
  開票動畫 (user 2026-11-05): election-night view where counted votes fly from where people live to the seats —
  「我們嘗試把開票地圖改成這種表達方式？」, 「按照data來源做幾個分頁（在同一頁裡）分開出來」, seats 「都放吧」.
  - one tab per data source; numbers are never merged across sources (same rule as live2026.html's per-source cards);
  - inner ring = 22 縣市長, outer ring = 910 縣市議員 (COUNCIL_SEATS + 原住民選區). A seat is hollow while its party
    leads and solid once the source marks it final; seats sort 綠 ← (open, grey) → 藍 as they fill;
  - base map = population lights (v2/popdots_taiwan_a.bin's tiers), lines start at lights inside the township that
    reported the votes; a line's width ∝ √(votes in its batch);
  - modes: 2026 開票 (data_live2026.js, re-read every 60 s) and 2022 排練 (data_liveflow_r2022.js: CEC-final numbers,
    the counting timeline is SIMULATED and labelled so);
  - 2026 縣市議員 have no party data yet (the sources give names + votes only): those seats stay white;
  - Canvas only, no V1 engine. Data: data_liveflow.js (build_v2_liveflow.py).
-->
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #000; color: #e7eaf0; margin: 0; }
  #lf { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; }
  #lf > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lf-tabs { position: absolute; top: 8px; left: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; z-index: 3; }
  .lf-tabs button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); color: #cfd4de; cursor: pointer; }
  .lf-tabs button[aria-pressed="true"] { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.4); }
  .lf-tabs button:disabled { opacity: .35; cursor: not-allowed; }
  .lf-tabs .ts { color: #9aa1b2; font-size: 10.5px; margin-left: 4px; }
  .lf-tabs .sep { width: 1px; height: 18px; background: rgba(255,255,255,.15); margin: 0 4px; }
  .lf-ctl { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .lf-ctl button { padding: 3px 9px; }
  .lf-banner { font-size: 11px; color: #f5c518; }
  .lf-hud { position: absolute; left: 12px; right: 12px; bottom: 10px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; z-index: 3; pointer-events: none; font-variant-numeric: tabular-nums; }
  .lf-side { min-width: 0; }
  .lf-side.r { text-align: right; }
  .lf-side .pt { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .lf-side .vn { font-size: clamp(20px, 3.2vw, 34px); font-weight: 800; line-height: 1.05; }
  .lf-side .vl { font-size: 10px; color: #9aa1b2; letter-spacing: .06em; }
  .lf-side .called { font-size: 14px; font-weight: 800; margin-top: 4px; }
  .lf-side .recent { font-size: 10.5px; color: #b8bfcc; min-height: 28px; }
  .lf-mid { text-align: center; font-size: 11px; color: #b8bfcc; min-width: 0; max-width: 46vw; }
  .lf-mid .clk { font-size: 16px; color: #fff; font-weight: 700; margin-bottom: 4px; }
  .lf-mid .gain { display: grid; grid-template-columns: repeat(3, auto); gap: 1px 14px; justify-content: center; font-weight: 700; font-size: 11.5px; }
  .lf-mid .prog { margin-top: 5px; }
  .lf-mid .src { margin-top: 2px; font-size: 10px; color: #7d8496; }
  .lf-legend { position: absolute; top: 40px; right: 14px; font-size: 10.5px; color: #9aa1b2; text-align: right; line-height: 1.6; z-index: 3; pointer-events: none; }
  .lf-cty { position: absolute; top: 108px; left: 14px; width: 230px; font-size: 11.5px; z-index: 3; font-variant-numeric: tabular-nums; }
  .lf-cty select { font: inherit; font-size: 12px; background: #11151f; color: #e7eaf0; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 3px 6px; max-width: 100%; }
  .lf-cty .box { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(10,13,22,.82); border: 1px solid rgba(255,255,255,.1); }
  .lf-cty h3 { font-size: 13px; margin: 0 0 4px; }
  .lf-cty .row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; margin: 2px 0; }
  .lf-cty .k { color: #9aa1b2; font-size: 10.5px; }
  .lf-cty .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .lf-cty .ring { display: inline-block; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid; vertical-align: middle; }
  /* 22 counties as framed boxes in two side columns (user 2026-11-07): left = the ruling DPP leads, right = an opposition party
     or an independent leads; every leading county of a side is listed at once, two boxes a row; invisible until the mouse is
     over the column (「完全看不到」), then all its boxes flash white and settle into their party colours; a box glides to the
     other side when its lead changes. Box: county + 「▸ 選區」, the two leading mayoral candidates with votes and a party-colour
     bar; 「▸ 選區」 opens the council district list (down to the first loser) under the box */
  #cols { position: absolute; inset: 0; pointer-events: none; z-index: 4; }   /* above the bottom totals (z 3): an open district list covers the big numbers (user 2026-11-07) */
  .col { position: absolute; width: 300px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3px 6px; align-content: start; pointer-events: auto; padding: 2px; }
  .col.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px 4px; }   /* too many boxes for two a row above the bottom totals (fitCols) */
  /* smaller boxes (user 2026-11-07: 「詳細開票資料可以再小塊一些，不要跟在野國民民眾黨那些字重疊」): 10.5 → 9.5 px, line 13 → 11 px */
  .cb { position: relative; border: 1px solid transparent; border-radius: 5px; padding: 2px 4px 1px; font-size: 9.5px; line-height: 11px;
        color: transparent; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cb .hd { display: flex; justify-content: space-between; font-weight: 700; }
  .cb .tg { cursor: pointer; font-weight: 400; }
  .cb { min-width: 0; }
  .cb .cn { display: flex; justify-content: space-between; gap: 4px; overflow: hidden; }
  .cb .cn span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* a long name (Kolas Yotaka) no longer widens its column */
  .cb .bar { height: 2px; border-radius: 1px; margin: 1px 0 2px; width: 0; transition: width .4s ease; }
  /* 過半保證當選 tick (user 2026-11-07: 「新版跟舊版也加入縣市長的當選門檻」): the bar is votes ÷ the county's expected
     total, so half of the track is where the win is certain; seen with the box (column hover), not for a sole candidate */
  .cb .bt { position: relative; }
  .cb .bt::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: 1px; width: 1px; background: rgba(255,255,255,.55); opacity: 0; }
  .col:hover .cb .bt::after { opacity: 1; transition: opacity .9s; }
  .cb.solo .bt::after { display: none; }
  .cb .det { display: none; position: absolute; left: -1px; top: 100%; width: 292px; padding: 4px 6px 6px; border-radius: 0 0 6px 6px;
             background: rgba(0,0,0,.92); border: 1px solid var(--pc); z-index: 5; color: #e7eaf0; white-space: normal; }
  .cb.open .det { display: block; }
  /* the right column's boxes open their district list toward the left (it ran off the screen's right edge) */
  #col-r .cb .det { left: auto; right: -1px; }
  .cb .det select { font: inherit; font-size: 11px; background: #11151f; color: #e7eaf0; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; margin: 2px 0 4px; }
  .cb .det .k { display: grid; grid-template-columns: 16px 1fr 62px; gap: 4px; }
  .cb .det .gap { color: #f5c518; }
  .col:hover .cb:not(.pin-on) { animation: cbGlow .9s forwards; }
  .col:hover .cb:not(.pin-on) .cn { animation: cnGlow .9s forwards; }
  .col:hover .cb:not(.pin-on) .bar { animation: barGlow .9s forwards; }
  /* 關注 (user 2026-11-07: 「加入想關注縣市的…開關的按鈕讓他常駐，不會滑鼠移開直接隱藏」, kept in place): ☆ / ★ in the box's
     header; a followed box stays lit where it is (it still changes side with the lead); remembered (localStorage lf_pins) */
  .cb .pin { cursor: pointer; font-weight: 400; margin-left: auto; margin-right: 6px; }
  .cb.pin-on { color: #e7eaf0; border-color: var(--pc); background: rgba(10,13,22,.88); }
  .cb.pin-on .cn { color: var(--cc); }
  .cb.pin-on .bar { background: var(--cc); opacity: .75; }
  .cb.pin-on .bt::after { opacity: 1; }
  .cb.pin-on .pin { color: #f5c518; }
  @keyframes cbGlow { 0% { color: #000; } 25% { color: #fff; border-color: rgba(255,255,255,.9); box-shadow: 0 0 8px rgba(255,255,255,.6); } 100% { color: #e7eaf0; border-color: var(--pc); box-shadow: none; } }
  @keyframes cnGlow { 0% { color: #000; } 25% { color: #fff; } 100% { color: var(--cc); } }
  @keyframes barGlow { 0% { background: transparent; } 25% { background: #fff; } 100% { background: var(--cc); opacity: .75; } }
  /* the picked county (menu or a click on its seats; user 2026-11-07: 「半圓形圖跟詳細開票資料聯動，選出某縣市之後他的詳細
     資料就出現在半圓形圖左邊黑暗處，其他縣市一樣保持在黑暗中」, summary box merged in): its box lit at the top of the left
     side, district list open, the summary (threshold, council seats) under it; the other boxes stay dark */
  #col-f { display: block; width: 300px; }
  #col-f .cb { color: #e7eaf0; border-color: var(--pc); background: rgba(10,13,22,.88); font-size: 10.5px; line-height: 13px; }
  #col-f .cb .cn { color: var(--cc); }
  #col-f .cb .bar { background: var(--cc); opacity: .75; }
  #col-f .cb .bt::after { opacity: 1; }
  #col-f .cb .det { display: block; position: static; width: auto; border: 0; padding: 4px 0 2px; background: none; }
  #col-f .cb .tg { display: none; }
  #col-f #cty { position: static; width: auto; margin-top: 4px; }
  #col-f #cty .box { margin-top: 0; }
  @media (max-width: 640px) { #cols { display: none; } }   /* two 300-px columns do not fit a phone; not designed yet */
  .lf-info { cursor: help; color: #9aa1b2; font-size: 13px; padding: 0 4px; }
  .lf-empty { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font-size: 13px; color: #9aa1b2; text-align: center; z-index: 3; }
  .lf-short { display: none; }
  /* phones (user 2026-11-07: 「開票的手機版擠在一起了」, approved): one-line header (「舊版」), the tab row one line that
     scrolls sideways instead of wrapping under the header, a shorter bottom block (3 gains, small source line, smaller totals) */
  @media (max-width: 640px) {
    .lf-full { display: none; } .lf-short { display: inline; }
    #v2-bar { gap: 6px; padding-left: 8px; padding-right: 8px; }
    #v2-bar .v2-title { font-size: 14px; } #v2-bar .v2-badge { display: none; }
    #v2-bar .v2-home { padding: 4px 8px; font-size: 12px; } #v2-bar .v2-lang button { padding: 3px 7px; font-size: 12px; }
    .lf-tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .lf-tabs::-webkit-scrollbar { display: none; }
    .lf-tabs > * { flex: 0 0 auto; }
    .lf-mid .src { font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lf-side .vn { font-size: 17px !important; }
    .lf-hud { grid-template-columns: 1fr 1fr; }
    .lf-mid { grid-column: 1 / 3; grid-row: 1; max-width: none; }
    .lf-legend { display: none; }
    .lf-cty { width: 170px; left: 10px; font-size: 10.5px; }
    .lf-cty .box { padding: 6px 8px; }
    .lf-tabs { gap: 4px; }
    .lf-tabs button { font-size: 11px; padding: 3px 8px; }
    .lf-tabs .ts { display: none; }
    .lf-tabs .sep { display: none; }
    .lf-side .vn { font-size: 20px; }
    .lf-side .recent { min-height: 0; }
  }
</style>

<script>
(function () {
  'use strict';
  // ---------- language (localStorage v2_lang, as every V2 page) ----------
  var lang = 'zh';
  try { lang = localStorage.getItem('v2_lang') === 'en' ? 'en' : 'zh'; } catch (e) {}
  var T = function (zh, en) { return lang === 'en' ? en : zh; };

  // party colours / names: the V2 set (final26.html)
  var CLR = { dpp: '#1b9e4b', kmt: '#3b82f6', tpp: '#26b5c4', npp: '#FBBE01', tsr: '#B33A1E', tsu: '#C69E6A', pfp: '#f06a0a', ind: '#888888', other: '#aaaaaa' };
  var LINE = { dpp: '#5fd38a', kmt: '#7fb0ff', tpp: '#6fe0ea', npp: '#ffd75e', tsr: '#e0715c', ind: '#c9ced8', other: '#c9ced8', pfp: '#ff9a4d', tsu: '#e0c08f' };
  var colorOf = function (p) { return CLR[p] || CLR.other; };
  var lineOf = function (p) { return LINE[p] || LINE.other; };
  // seat order left → right: 綠 side, then the open (uncalled / no data) middle, then the rest, 藍 at the right end
  var ORDER = { dpp: 0, tsr: 1, npp: 2, gp: 3, sdp: 3, tsu: 4, _open: 5, tpp: 6, ind: 7, other: 8, pfp: 9, np: 9, mkt: 9, kmt: 10 };
  var orderOf = function (p) { return p == null ? ORDER._open : (p in ORDER ? ORDER[p] : ORDER.other); };

  var NAMES = LF_SEATS.names, CC_EN = { '63': 'Taipei', '65': 'New Taipei', '68': 'Taoyuan', '66': 'Taichung', '67': 'Tainan', '64': 'Kaohsiung',
    '10002': 'Yilan', '10017': 'Keelung', '10018': 'Hsinchu City', '10004': 'Hsinchu Co.', '10005': 'Miaoli', '10007': 'Changhua', '10008': 'Nantou',
    '10009': 'Yunlin', '10010': 'Chiayi Co.', '10020': 'Chiayi City', '10013': 'Pingtung', '10015': 'Hualien', '10014': 'Taitung', '10016': 'Penghu', '09020': 'Kinmen', '09007': 'Lienchiang' };
  var ccName = function (cc) { return lang === 'en' ? (CC_EN[cc] || cc) : (NAMES[cc] || cc).replace(/[縣市]$/, ''); };

  // ---------- seeded RNG (the simulation must look the same every time) ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- canvases ----------
  var root = document.getElementById('lf');
  var cvBg = document.getElementById('cv-bg'), cvTr = document.getElementById('cv-trail'), cvTop = document.getElementById('cv-top');
  var gBg = cvBg.getContext('2d'), gTr = cvTr.getContext('2d'), gTop = cvTop.getContext('2d');
  var cvPil = document.getElementById('cv-pil'), gPil = cvPil.getContext('2d');
  var DPR = 1, SW = 0, SH = 0, L = null;   // L = layout (map transform, hemicycle geometry)

  function layout() {
    // the stage starts under the header as it actually stands (on a phone the header can wrap to two lines and used to
    // cover the tab row)
    var bar = document.getElementById('v2-bar'); if (bar) root.style.top = bar.offsetHeight + 'px';
    DPR = Math.min(2, window.devicePixelRatio || 1);
    SW = root.clientWidth; SH = root.clientHeight;
    [cvBg, cvPil, cvTr, cvTop].forEach(function (c) { c.width = Math.round(SW * DPR); c.height = Math.round(SH * DPR); });
    [gBg, gPil, gTr, gTop].forEach(function (g) { g.setTransform(DPR, 0, 0, DPR, 0, 0); });
    var narrow = SW < 640;
    var top = document.getElementById('tabs').offsetHeight + 16;
    document.getElementById('cty').style.top = (top + 4) + 'px'; document.getElementById('cty').style.zIndex = 4;
    // hemicycle on top, the map under it. (The 3D views — tilted, room, orbit, wall — were tried 2026-11-05…07 and
    // dropped by the user: 「算了算了…刪掉」; only this flat view stays.)
    var hudH = Math.max(narrow ? 170 : 96, (narrow ? document.querySelector('.lf-hud') : document.getElementById('hud-m')).offsetHeight + 18);
    // hemicycle smaller so the island gets the room (user 2026-11-07: 「台灣的光點在平面還是比半圓形圖小」→ approved: ~26 % of
    // the height for the hemicycle, the island about twice its height)
    var R = Math.min(SW * (narrow ? 0.40 : 0.30), (SH - top) * (narrow ? 0.24 : 0.26));
    var cx = SW / 2, cy = top + R + 6, mapTop = cy + 8, mapH = Math.max(120, SH - hudH - mapTop - 4);
    // the main island lines up with the hemicycle (user: 「台灣在平面跟半圓形還是沒有一條線」): its centre line under the
    // hemicycle's centre, its northern tip right under the base. Fitted on the main island, not the whole frame (the
    // frame's left part is 金門 / 連江, which pushed the island off-centre)
    var k = Math.min((narrow ? 0.94 : 0.6) * SW / (ISLF.x1 - ISLF.x0), mapH / (ISLF.y1 - ISLF.y0));
    L = { R: R, cx: cx, cy: cy, k: k, ox: cx - (ISLF.x0 + ISLF.x1) / 2 * k, oy: mapTop - ISLF.y0 * k };
    if (LIE) { FOC = (SW / 2) / Math.tan((narrow ? 80 : 64) / 2 * Math.PI / 180); setCamLie(top, hudH); }
    buildSlots();
    drawBg();
    gTr.clearRect(0, 0, SW, SH); PARTS = [];
  }
  // main island extent in map-frame px (no 金門 / 連江 / 澎湖), from the lit points inside its townships
  var ISLF = (function () {
    var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    Object.keys(LF_TOWNS).forEach(function (tc) {
      var t = LF_TOWNS[tc]; if (['09007', '09020', '10016'].indexOf(t[0]) >= 0) return;
      var pts = t[3].length ? t[3] : [t[1], t[2]];
      for (var i = 0; i < pts.length; i += 2) { x0 = Math.min(x0, pts[i]); x1 = Math.max(x1, pts[i]); y0 = Math.min(y0, pts[i + 1]); y1 = Math.max(y1, pts[i + 1]); }
    });
    return { x0: x0, x1: x1, y0: y0, y1: y1 };
  })();
  // ---------- views: 平面 (flat) and 平躺 (lying) ----------
  // 平躺 (user 2026-11-07: 「請你按照S__104423431_0.jpg做出平躺視角」, seen 「從西方的台灣海峽看」): as the reference frame —
  // the island lies on the floor seen from very low, a thin band at the bottom; the hemicycle lies FLAT (parallel to the
  // floor) high above the island's centre, seen from below so its seats are flattened ellipses; the camera stands over
  // the Taiwan Strait (north on the left), swung 30° towards the south so the hemicycle's right (south) end is nearer;
  // lines rise from the floor almost straight up into the hemicycle. The camera is fixed; its distance is fitted to the
  // screen (setCamLie) so the hemicycle and the island both fit vertically (left / right may overflow, as in the reference)
  // phones: the flat view only, no 3D (user 2026-11-07: 「手機版只給平面不開放3d」) — a phone = a narrow window, or a touch
  // screen whose short side is at most 500 px (so a phone turned sideways stays flat too)
  var PHONE = window.innerWidth <= 640 || (window.matchMedia && matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 500);
  var VIEW_KEY = 'lf_view';
  var VIEW = 'flat';

        '<button type="button" data-cam0="1" title="' + T('回到預設角度', 'Reset view') + '">⟲</button>' : '');
    html += ctySelectHtml() + '<span class="lf-info" title="' + legendText().replace(/"/g, '&quot;') + '">ⓘ</span>';
    if (!keys.length) html += '<span class="lf-banner">' + T('目前還沒有任何來源的開票資料', 'No source has reported yet') + '</span>';
    var f = FEEDS[SRC];
    if (f && f.sim) html += '<span class="lf-ctl"><button type="button" data-ctl="play">' + (PLAY ? '❚❚' : '▶') + '</button>' +
      '<button type="button" data-ctl="speed">' + SPEED + '×</button><button type="button" data-ctl="restart">↺</button></span>';
    el.innerHTML = html;
    el.querySelectorAll('button[data-src]').forEach(function (b) { b.onclick = function () { SRC = b.dataset.src; restart(); }; });
    el.querySelectorAll('button[data-view]').forEach(function (b) { b.onclick = function () {
      VIEW = LIE ? 'flat' : 'lie'; LIE = VIEW === 'lie';
      try { localStorage.setItem(VIEW_KEY, VIEW); } catch (e) {}
      root.style.cursor = LIE ? 'grab' : ''; layout(); renderTabs(); }; });
    el.querySelectorAll('button[data-pil]').forEach(function (b) { b.onclick = function () {
      PIL_MODE = PIL_MODE === 'cell' ? 'smooth' : 'cell';
      try { localStorage.setItem('lf_pil', PIL_MODE); } catch (e) {}
      renderTabs(); drawPillars(); }; });
    el.querySelectorAll('button[data-cam0]').forEach(function (b) { b.onclick = function () {
      if (LCAM0) { LMOVED = false; CAM_TW++; LCAM = Object.assign({}, LCAM0); applyCam(); camChanged(); } }; });
    var cs2 = el.querySelector('.lf-ctysel');
    if (cs2) cs2.onchange = function () { pickCounty(this.value || null); };
    el.querySelectorAll('button[data-mode]').forEach(function (b) { b.onclick = function () { setMode(b.dataset.mode); }; });
    el.querySelectorAll('button[data-ctl]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.ctl === 'play') { if (simT >= SIM.end) restart(); else PLAY = !PLAY; }
        else if (b.dataset.ctl === 'speed') SPEED = SPEED === 1 ? 2 : SPEED === 2 ? 4 : SPEED === 4 ? 0.5 : 1;
        else restart();
        renderTabs();
      };
    });
    ctySelect();
    var empty = document.getElementById('empty');
    empty.hidden = !!(f && (Object.keys(f.M).length || Object.keys(f.C).length));
    empty.textContent = MODE === 'live' ? T('2026 開票還沒開始，或來源還沒有資料。可以先看「2022 排練」。', 'The 2026 count has not started or no source has data yet — try the 2022 rehearsal.') : '';
  }
  function legendText() {   // the ⓘ tooltip in the tab row (the legend used to sit at the top right)
    return [T('內圈 縣市長 22 席・外圈 縣市議員 910 席', 'Inner ring: 22 mayors · outer ring: 910 councillors'),
      T('空心＝目前領先・實心＝確定', 'Hollow = leading · solid = final'), T('平躺視角：拖曳轉角度・滾輪拉近拉遠', 'Lying view: drag to turn · wheel to zoom'), T('線越粗＝那個鄉鎮這一批開出的票越多', 'Thicker line = a bigger batch of votes from that township')]
      .concat(LIE ? [T('光柱＝鄉鎮已開出的縣市長票，鄉鎮內依人口平均分配（示意）', 'Pillars = a township\'s counted mayoral votes, spread by population (illustrative)')] : [])
      .concat(MODE === 'live' ? [T('黨籍＝來源網站的政黨圖示；沒有圖示的以白色表示', 'Party = the source\'s party icon; none shown white')] : [])
      .concat([T('左右兩欄：滑鼠移到兩側顯示各縣市；左＝民進黨領先，右＝在野或無黨籍領先', 'Side columns: hover a side to see the counties; left = DPP leads, right = opposition / independent leads')]).join('\n');
  }
  function resetState() {
    SEATS.forEach(function (s) { s.p = null; s.st = 'none'; });
    PREV = null; ACC = {}; LASTE = {}; PARTS = []; HIST = []; RECENT = { g: [], b: [] };
    PIL_SNAP = null; gPil.clearRect(0, 0, SW, SH); dimFloor(false); pilReset();
    gTr.clearRect(0, 0, SW, SH); placeSeats(true);
  }
  function restart() {
    resetState(); simT = SIM.start; PLAY = !REDUCED; if (REDUCED) simT = SIM.end;
    if (!FEEDS[SRC]) SRC = feedKeys()[0] || null;
    var f = FEEDS[SRC];
    if (f) { if (f.sim) { tick(f, simT, false); } else { PREV = { T: {}, M: {}, C: {} }; tick(f, null, true); } }
    else { ['hud-g', 'hud-m', 'hud-b'].forEach(function (id) { document.getElementById(id).innerHTML = ''; });   // no source: no stale numbers
      PIL_SNAP = null; drawPillars(); }   // …but the island's outline still drawn (lying view) — 2026 before any source reports
    renderTabs();
  }
  function setMode(m) {
    MODE = m;
    useSeats(m === 'r2022' ? '2022' : '2026');
    if (m === 'r2022') { FEEDS = REH; SRC = 'ltn_cec'; restart(); }
    else { FEEDS = LIVE || {}; SRC = null; renderTabs(); loadLive(function () { FEEDS = LIVE; SRC = null; renderTabs(); restart(); nextLive = performance.now() + 60000; }); }
  }

  // ---------- language ----------
  function applyLang() {
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
    [].forEach.call(document.querySelectorAll('[data-zh]'), function (e) { e.textContent = lang === 'en' ? e.dataset.en : e.dataset.zh; });
    [].forEach.call(document.querySelectorAll('.v2-lang button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    renderTabs();
    // the county boxes are built once (crRow): re-label their fixed texts, then redraw the numbers in the new language
    // (user 2026-11-07: 「中英文切換時詳細縣市卡沒有直接換英文」)
    relabelBoxes();
    lastHud = 0;
    var f = FEEDS[SRC]; if (f && PREV) hud(f, PREV);
  }
  function relabelBoxes() {
    Object.keys(CROWS).forEach(function (cc) {
      var el = CROWS[cc]; if (el.__showPin) el.__showPin();
      el.querySelector('.nm').textContent = ccName(cc);
      el.querySelector('.tg').textContent = (el.classList.contains('open') ? '▾ ' : '▸ ') + T('選區', 'Districts');
      [].forEach.call(el.querySelectorAll('select option'), function (o) {
        var dk = o.value, n = LF_SEATS.council[dk] ? LF_SEATS.council[dk][1] : '';
        o.textContent = T('第' + (+dk.split('_')[1]) + '選區（應選' + n + '席）', 'District ' + (+dk.split('_')[1]) + ' (' + n + ' seats)');
      });
    });
  }
  [].forEach.call(document.querySelectorAll('.v2-lang button'), function (b) {
    b.onclick = function () { lang = b.dataset.lang; try { localStorage.setItem('v2_lang', lang); } catch (e) {} applyLang(); };
  });

  // ---------- start ----------
  var REH = buildRehearsal();
  window.addEventListener('resize', function () { clearTimeout(window.__lfR); window.__lfR = setTimeout(layout, 120); });
  root.style.cursor = LIE ? 'grab' : '';
  layout();
  // opens on 2026 (user 2026-11-07: 「新版應該要改成2026開票夜」, picked 「2026 開票夜＋預設 2026」); before any source has
  // reported it says so, the 2022 rehearsal one tab away (it used to open on the rehearsal until a source reported)
  loadLive(function () {
    MODE = 'live'; FEEDS = LIVE; useSeats('2026'); nextLive = performance.now() + 60000;
    restart(); applyLang(); layout(); restart();
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
